services:
  calorieai-gateway:
    container_name: calorieai-gateway
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - /srv/calorieai-updates/public:/calorieai/public:ro
      - /srv/calorieai-web:/calorieai/web:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
