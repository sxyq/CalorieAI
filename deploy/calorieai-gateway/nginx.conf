worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Keep the small gateway bounded while allowing two independent downloads.
    limit_conn_zone $server_name zone=calorieai_downloads:64k;

    server {
        listen 8080;
        server_name _;
        root /calorieai/web;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location = /android/stable/latest.json {
            alias /calorieai/public/android/stable/latest.json;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/CalorieAI-v[0-9]+\.[0-9]+\.[0-9]+\.apk$ {
            root /calorieai/public;
            default_type application/vnd.android.package-archive;
            limit_conn calorieai_downloads 2;
            limit_conn_status 429;
            limit_rate 16m;
            max_ranges 1;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /releases/ {
            return 404;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
