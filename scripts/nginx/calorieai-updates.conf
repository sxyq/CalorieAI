# Static Android update service. The default Nginx site remains unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name update.sxyq27.online;

    access_log /var/log/nginx/calorieai-updates.access.log;
    error_log /var/log/nginx/calorieai-updates.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/calorieai-updates/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://update.sxyq27.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name update.sxyq27.online;

    ssl_certificate /etc/letsencrypt/live/update.sxyq27.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.sxyq27.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/calorieai-updates.access.log;
    error_log /var/log/nginx/calorieai-updates.error.log warn;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /android/stable/latest.json {
        alias /srv/calorieai-updates/public/android/stable/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/CalorieAI-v[0-9]+\.[0-9]+\.[0-9]+\.apk$ {
        root /srv/calorieai-updates/public;
        default_type application/vnd.android.package-archive;
        limit_conn calorieai_update_downloads 2;
        limit_rate 16m;
        max_ranges 1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
