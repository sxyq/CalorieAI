# Public edge for the CalorieAI update and future website container.
# Install this file in /etc/nginx/conf.d/ on 124. The existing sites remain unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name calorieai.sxyq27.online;

    access_log /var/log/nginx/calorieai-updates.access.log;
    error_log /var/log/nginx/calorieai-updates.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        alias /srv/calorieai-updates/public/.well-known/acme-challenge/;
        default_type text/plain;
    }

    location / {
        return 301 https://calorieai.sxyq27.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calorieai.sxyq27.online;

    ssl_certificate /etc/letsencrypt/live/calorieai.sxyq27.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calorieai.sxyq27.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/calorieai-updates.access.log;
    error_log /var/log/nginx/calorieai-updates.error.log warn;

    location = /healthz {
        proxy_pass http://127.0.0.1:18090/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    location = /android/stable/latest.json {
        proxy_pass http://127.0.0.1:18090/android/stable/latest.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/CalorieAI-v[0-9]+\.[0-9]+\.[0-9]+\.apk$ {
        limit_conn calorieai_update_downloads 1;
        limit_conn_status 429;
        error_page 429 = @calorieai_download_busy;

        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    location = /releases/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    location @calorieai_download_busy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"download_busy","message":"download capacity busy"}';
    }
}
